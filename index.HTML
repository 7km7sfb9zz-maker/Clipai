<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipAI</title>

  <style>
    body {
      margin: 0;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 60px 20px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
      font-size: 18px;
    }

    .upload {
      margin-top: 40px;
      padding: 25px;
      border: 2px dashed #444;
      border-radius: 20px;
    }

    button {
      margin-top: 20px;
      padding: 15px 30px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>ClipAI</h1>

  <p>
    AI-powered video clipping.
  </p>

  <div class="upload">

    <h2>Upload a video</h2>

    <input type="file" accept="video/*">

    <br>

    <button>
      Find Viral Clips
    </button>

  </div>

</div>

</body>
</html>
