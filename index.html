<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ClipAI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #080808;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 60px 20px;
    text-align: center;
}

.logo {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -2px;
}

.logo span {
    color: #7c5cff;
}

.subtitle {
    color: #999;
    font-size: 18px;
    margin-bottom: 40px;
}

.upload {
    background: #111;
    border: 2px dashed #333;
    border-radius: 20px;
    padding: 35px 20px;
}

input[type="file"] {
    width: 100%;
    margin-top: 20px;
}

button {
    margin-top: 25px;
    padding: 15px 30px;
    border: none;
    border-radius: 12px;
    background: #7c5cff;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#status {
    margin-top: 20px;
    color: #aaa;
    min-height: 24px;
}

.info-panel {
    display: none;
    margin-top: 25px;
    padding: 20px;
    background: #151515;
    border-radius: 16px;
    text-align: left;
}

.info-panel h3 {
    margin-top: 0;
}

.info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.info-item {
    background: #1c1c1c;
    padding: 14px;
    border-radius: 12px;
}

.info-label {
    color: #888;
    font-size: 12px;
    margin-bottom: 5px;
}

.info-value {
    font-weight: bold;
    font-size: 16px;
}

.warning {
    margin-top: 15px;
    padding: 13px;
    background: #201d12;
    border-radius: 10px;
    color: #e5c86c;
    font-size: 14px;
    line-height: 1.5;
}

.progress-container {
    display: none;
    margin-top: 20px;
    text-align: left;
}

.progress-bar {
    height: 10px;
    background: #222;
    border-radius: 10px;
    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: #7c5cff;
    transition: width 0.3s ease;
}

.progress-text {
    margin-top: 8px;
    color: #999;
    font-size: 13px;
}

.clip {
    margin-top: 20px;
    padding: 20px;
    background: #151515;
    border-radius: 15px;
    text-align: left;
}

.viral {
    border: 1px solid #292929;
}

.hook {
    font-size: 21px;
    font-weight: 700;
    line-height: 1.5;
}

.hook-label {
    color: #7c5cff;
    font-weight: bold;
    margin-bottom: 8px;
}

.score {
    font-size: 28px;
    font-weight: 800;
}

.score-label {
    color: #999;
    font-size: 13px;
}

.clip-time {
    color: #7c5cff;
    font-weight: bold;
    margin-top: 12px;
}

.reason {
    color: #bbb;
    line-height: 1.5;
}

.success {
    color: #66ff99;
}

.error {
    color: #ff6666;
}

.transcript {
    white-space: pre-wrap;
    line-height: 1.6;
}

@media (max-width: 500px) {

    .info-grid {
        grid-template-columns: 1fr;
    }

    .logo {
        font-size: 44px;
    }

}

</style>

</head>


<body>


<div class="container">


<h1 class="logo">
Clip<span>AI</span>
</h1>


<p class="subtitle">
Turn long videos into short-form content.
</p>


<div class="upload">


<h2>
Upload a video
</h2>


<p>
ClipAI will analyse your video using AI.
</p>


<input
    type="file"
    id="video"
    accept="video/*"
>


<!-- ============================== -->
<!-- VIDEO INFORMATION -->
<!-- ============================== -->

<div
    id="videoInfo"
    class="info-panel"
>

    <h3>
        🎥 Video Information
    </h3>

    <div class="info-grid">

        <div class="info-item">

            <div class="info-label">
                VIDEO LENGTH
            </div>

            <div
                id="durationInfo"
                class="info-value"
            >
                —
            </div>

        </div>


        <div class="info-item">

            <div class="info-label">
                FILE SIZE
            </div>

            <div
                id="sizeInfo"
                class="info-value"
            >
                —
            </div>

        </div>


        <div class="info-item">

            <div class="info-label">
                ESTIMATED CHUNKS
            </div>

            <div
                id="chunksInfo"
                class="info-value"
            >
                —
            </div>

        </div>


        <div class="info-item">

            <div class="info-label">
                CHUNK SIZE
            </div>

            <div
                id="chunkSizeInfo"
                class="info-value"
            >
                5 minutes
            </div>

        </div>


        <div class="info-item">

            <div class="info-label">
                ESTIMATED PROCESSING
            </div>

            <div
                id="timeInfo"
                class="info-value"
            >
                —
            </div>

        </div>


        <div class="info-item">

            <div class="info-label">
                STORAGE
            </div>

            <div
                id="storageInfo"
                class="info-value"
            >
                Device only
            </div>

        </div>

    </div>


    <div
        id="warning"
        class="warning"
        style="display:none;"
    ></div>

</div>


<br>


<button
    id="analyseButton"
    onclick="analyse()"
>

Find Viral Clips

</button>


<!-- ============================== -->
<!-- PROGRESS -->
<!-- ============================== -->

<div
    id="progressContainer"
    class="progress-container"
>

    <div class="progress-bar">

        <div
            id="progressFill"
            class="progress-fill"
        ></div>

    </div>

    <div
        id="progressText"
        class="progress-text"
    >
        Preparing...
    </div>

</div>


<div id="status"></div>


<div id="results"></div>


</div>


</div>


<script>


const API_URL =
"https://clipai-api.7km7sfb9zz.workers.dev";


const CHUNK_MINUTES =
5;


const fileInput =
document.getElementById("video");


fileInput.addEventListener(
    "change",
    inspectVideo
);


// ==============================
// INSPECT VIDEO
// ==============================

function inspectVideo() {

    const file =
        fileInput.files[0];

    const panel =
        document.getElementById("videoInfo");

    const warning =
        document.getElementById("warning");

    if (!file) {

        panel.style.display =
            "none";

        return;

    }


    const video =
        document.createElement("video");


    video.preload =
        "metadata";


    video.onloadedmetadata =
        function() {

            const duration =
                video.duration;


            const chunks =
                Math.ceil(
                    duration /
                    (CHUNK_MINUTES * 60)
                );


            document.getElementById(
                "durationInfo"
            ).innerText =
                formatDuration(duration);


            document.getElementById(
                "sizeInfo"
            ).innerText =
                formatBytes(file.size);


            document.getElementById(
                "chunksInfo"
            ).innerText =
                chunks;


            document.getElementById(
                "chunkSizeInfo"
            ).innerText =
                CHUNK_MINUTES +
                " minutes";


            document.getElementById(
                "timeInfo"
            ).innerText =
                estimateProcessingTime(
                    duration,
                    file.size
                );


            panel.style.display =
                "block";


            // ==============================
            // LARGE VIDEO WARNING
            // ==============================

            if (duration >= 3600) {

                warning.style.display =
                    "block";

                warning.innerHTML =
                    "⚠️ <strong>Long video detected.</strong><br>" +
                    "ClipAI will process this in " +
                    chunks +
                    " smaller chunks instead of " +
                    "sending the entire video at once.";

            }

            else if (file.size > 500 * 1024 * 1024) {

                warning.style.display =
                    "block";

                warning.innerHTML =
                    "⚠️ <strong>Large file detected.</strong><br>" +
                    "ClipAI will need to process the video " +
                    "in smaller pieces.";

            }

            else {

                warning.style.display =
                    "none";

            }


            URL.revokeObjectURL(
                video.src
            );

        };


    video.onerror =
        function() {

            panel.style.display =
                "none";

            warning.style.display =
                "block";

            warning.innerText =
                "⚠️ Could not read this video.";

        };


    video.src =
        URL.createObjectURL(file);

}


// ==============================
// ESTIMATE PROCESSING TIME
// ==============================

function estimateProcessingTime(
    duration,
    fileSize
) {

    const minutes =
        duration / 60;


    /*
     * This is only a rough estimate.
     *
     * The real processing time will depend
     * on upload speed, AI availability,
     * video complexity and chunk processing.
     */

    let estimated =
        minutes * 0.18;


    if (fileSize >
        1024 * 1024 * 1024) {

        estimated += 2;

    }


    if (estimated < 1) {

        estimated = 1;

    }


    const low =
        Math.max(
            1,
            Math.round(
                estimated * 0.7
            )
        );


    const high =
        Math.max(
            low + 1,
            Math.round(
                estimated * 1.6
            )
        );


    return (
        "~" +
        low +
        "–" +
        high +
        " min"
    );

}


// ==============================
// ANALYSE
// ==============================

async function analyse() {

    const file =
        fileInput.files[0];


    const status =
        document.getElementById("status");


    const results =
        document.getElementById("results");


    const button =
        document.getElementById(
            "analyseButton"
        );


    const progressContainer =
        document.getElementById(
            "progressContainer"
        );


    const progressFill =
        document.getElementById(
            "progressFill"
        );


    const progressText =
        document.getElementById(
            "progressText"
        );


    if (!file) {

        status.innerText =
            "Please select a video first.";

        status.className =
            "error";

        return;

    }


    button.disabled =
        true;


    results.innerHTML =
        "";


    progressContainer.style.display =
        "block";


    progressFill.style.width =
        "5%";


    progressText.innerText =
        "Preparing your video...";


    status.innerText =
        "Preparing your video...";


    status.className =
        "";


    try {

        const formData =
            new FormData();


        formData.append(
            "audio",
            file
        );


        progressFill.style.width =
            "10%";


        progressText.innerText =
            "📤 Uploading video...";


        status.innerText =
            "Uploading video to ClipAI...";


        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",
                    body: formData
                }
            );


        progressFill.style.width =
            "75%";


        progressText.innerText =
            "🧠 AI is analysing your video...";


        const responseText =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(
                    responseText
                );

        }

        catch {

            throw new Error(
                "Worker returned an invalid response: " +
                responseText
            );

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Worker returned an error."
            );

        }


        progressFill.style.width =
            "100%";


        progressText.innerText =
            "✅ Analysis complete";


        status.innerText =
            "✅ AI analysis complete!";


        status.className =
            "success";


        let viralHTML =
            "";


        if (
            data.viralClips &&
            data.viralClips.length > 0
        ) {

            viralHTML = `

                <div class="clip">

                    <h2>
                        🔥 Viral Clips Found
                    </h2>

                    ${
                        data.viralClips
                        .map(
                            (clip, index) => {

                                return `

                                    <div
                                        class="clip viral"
                                    >

                                        <h3>
                                            🔥 Viral Clip #${
                                                index + 1
                                            }
                                        </h3>

                                        <div class="score">
                                            ${
                                                escapeHTML(
                                                    clip.score
                                                )
                                            }/100
                                        </div>

                                        <div class="score-label">
                                            Viral potential
                                        </div>

                                        <div class="clip-time">
                                            ⏱️
                                            ${
                                                formatTime(
                                                    clip.start
                                                )
                                            }
                                            →
                                            ${
                                                formatTime(
                                                    clip.end
                                                )
                                            }
                                        </div>

                                        ${
                                            clip.hook
                                            ?
                                            `
                                            <p>
                                                🪝 <strong>
                                                ${
                                                    escapeHTML(
                                                        clip.hook
                                                    )
                                                }
                                                </strong>
                                            </p>
                                            `
                                            :
                                            ""
                                        }

                                        <p class="reason">
                                            ${
                                                escapeHTML(
                                                    clip.reason ||
                                                    "Strong potential moment."
                                                )
                                            }
                                        </p>

                                    </div>

                                `;

                            }
                        )
                        .join("")
                    }

                </div>

            `;

        }


        results.innerHTML = `

            ${viralHTML}


            ${
                data.hook
                ?
                `
                <div class="clip">

                    <div class="hook-label">
                        🧠 AI-GENERATED HOOK
                    </div>

                    <div class="hook">
                        ${
                            escapeHTML(
                                data.hook
                            )
                        }
                    </div>

                </div>
                `
                :
                ""
            }


            <div class="clip">

                <h3>
                    🎙️ AI Transcript
                </h3>

                <p class="transcript">
                    ${
                        escapeHTML(
                            data.transcript ||
                            "No speech was detected."
                        )
                    }
                </p>

            </div>

        `;


    }

    catch (error) {

        console.error(
            "ClipAI error:",
            error
        );


        progressFill.style.width =
            "0%";


        progressText.innerText =
            "❌ Processing failed";


        status.innerText =
            "Could not connect to ClipAI.";


        status.className =
            "error";


        results.innerHTML = `

            <div class="clip">

                <h3>
                    ❌ Connection Error
                </h3>

                <p>
                    ${
                        escapeHTML(
                            error.message
                        )
                    }
                </p>

            </div>

        `;

    }


    button.disabled =
        false;

}


// ==============================
// FORMAT DURATION
// ==============================

function formatDuration(
    seconds
) {

    seconds =
        Math.floor(
            seconds
        );


    const hours =
        Math.floor(
            seconds / 3600
        );


    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );


    const remaining =
        seconds % 60;


    if (hours > 0) {

        return (
            hours +
            "h " +
            minutes +
            "m"
        );

    }


    return (
        minutes +
        "m " +
        remaining +
        "s"
    );

}


// ==============================
// FORMAT FILE SIZE
// ==============================

function formatBytes(
    bytes
) {

    if (bytes === 0) {

        return "0 Bytes";

    }


    const units =
        [
            "Bytes",
            "KB",
            "MB",
            "GB",
            "TB"
        ];


    const i =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    return (
        parseFloat(
            (
                bytes /
                Math.pow(
                    1024,
                    i
                )
            )
            .toFixed(2)
        ) +
        " " +
        units[i]
    );

}


// ==============================
// FORMAT TIME
// ==============================

function formatTime(
    seconds
) {

    seconds =
        Number(seconds) || 0;


    const minutes =
        Math.floor(
            seconds / 60
        );


    const remaining =
        Math.floor(
            seconds % 60
        );


    return (
        String(minutes)
            .padStart(2, "0") +
        ":" +
        String(remaining)
            .padStart(2, "0")
    );

}


// ==============================
// ESCAPE HTML
// ==============================

function escapeHTML(
    text
) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

</script>


</body>

</html>
