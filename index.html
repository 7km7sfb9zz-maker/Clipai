<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ClipAI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #080808;
    color: white;
    font-family: -apple-system,
                 BlinkMacSystemFont,
                 "Segoe UI",
                 Arial,
                 sans-serif;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 60px 20px;
    text-align: center;
}

.logo {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -2px;
}

.logo span {
    color: #7c5cff;
}

.subtitle {
    color: #999;
    font-size: 18px;
    margin-bottom: 40px;
}

.upload {
    background: #111;
    border: 2px dashed #333;
    border-radius: 20px;
    padding: 35px 20px;
}

input[type="file"] {
    width: 100%;
    margin-top: 20px;
}

button {
    margin-top: 25px;
    padding: 15px 30px;
    border: none;
    border-radius: 12px;
    background: #7c5cff;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}

button:disabled {
    opacity: 0.5;
}

#status {
    margin-top: 20px;
    color: #aaa;
    min-height: 24px;
}

.clip {
    margin-top: 20px;
    padding: 20px;
    background: #151515;
    border-radius: 15px;
    text-align: left;
}

.success {
    color: #66ff99;
}

.error {
    color: #ff6666;
}

.score {
    color: #7c5cff;
    font-weight: bold;
}

</style>
</head>


<body>


<div class="container">


<h1 class="logo">
Clip<span>AI</span>
</h1>


<p class="subtitle">
Turn long videos into short-form content.
</p>


<div class="upload">


<h2>
Upload a video
</h2>


<p>
Choose a video and let ClipAI analyse it.
</p>


<input
    type="file"
    id="video"
    accept="video/*"
>


<br>


<button
    id="analyseButton"
    onclick="analyse()"
>

Find Viral Clips

</button>


<div id="status"></div>


<div id="results"></div>


</div>


</div>


<script>


// ========================================
// CLIPAI CONFIGURATION
// ========================================

const API_URL =
"https://clipai-api.7km7sfb9zz.workers.dev";


// ========================================
// FORMAT SECONDS INTO MM:SS
// ========================================

function formatTime(seconds) {

    seconds = Math.floor(seconds);

    const minutes =
        Math.floor(seconds / 60);

    const remaining =
        seconds % 60;

    return (
        String(minutes).padStart(2, "0")
        + ":"
        + String(remaining).padStart(2, "0")
    );

}


// ========================================
// MAIN ANALYSIS FUNCTION
// ========================================

async function analyse() {


    const file =
        document.getElementById("video").files[0];


    const status =
        document.getElementById("status");


    const results =
        document.getElementById("results");


    const button =
        document.getElementById("analyseButton");


    // ----------------------------------------
    // Check for video
    // ----------------------------------------

    if (!file) {

        status.innerText =
            "Please select a video first.";

        status.className =
            "error";

        return;

    }


    // ----------------------------------------
    // Reset interface
    // ----------------------------------------

    results.innerHTML = "";

    status.innerText =
        "Reading video...";

    status.className = "";

    button.disabled = true;


    // ----------------------------------------
    // Create temporary video element
    // ----------------------------------------

    const video =
        document.createElement("video");


    video.preload =
        "metadata";


    // ----------------------------------------
    // When video metadata loads
    // ----------------------------------------

    video.onloadedmetadata =
        async function() {


            const duration =
                video.duration;


            // --------------------------------
            // Validate duration
            // --------------------------------

            if (
                !Number.isFinite(duration)
                ||
                duration <= 0
            ) {

                status.innerText =
                    "Could not determine video duration.";

                status.className =
                    "error";

                button.disabled = false;

                return;

            }


            status.innerText =
                "Video detected: "
                + formatTime(duration)
                + " — connecting to ClipAI...";


            // --------------------------------
            // Send information to Worker
            // --------------------------------

            try {


                const response =
                    await fetch(

                        API_URL,

                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    transcript:
                                        "Temporary test transcript.",

                                    duration:
                                        duration

                                })

                        }

                    );


                // --------------------------------
                // Read Worker response
                // --------------------------------

                const data =
                    await response.json();


                // --------------------------------
                // Check HTTP status
                // --------------------------------

                if (!response.ok) {

                    throw new Error(

                        data.error ||
                        "Worker returned an error."

                    );

                }


                // --------------------------------
                // Success
                // --------------------------------

                status.innerText =
                    "ClipAI backend connected!";

                status.className =
                    "success";


                results.innerHTML = `

                    <div class="clip">

                        <h3>
                            ✅ Backend Connected
                        </h3>

                        <p>

                            <b>
                                Video length:
                            </b>

                            ${formatTime(duration)}

                        </p>

                        <p>

                            <b>
                                Worker received:
                            </b>

                            ${formatTime(data.duration)}

                        </p>

                        <p>

                            <b>
                                Transcript received:
                            </b>

                            ${data.transcriptLength}
                            characters

                        </p>

                        <p class="score">

                            API connection successful

                        </p>

                    </div>

                `;


            }


            // --------------------------------
            // Error handling
            // --------------------------------

            catch (error) {


                console.error(
                    "ClipAI error:",
                    error
                );


                status.innerText =
                    "Could not connect to ClipAI.";

                status.className =
                    "error";


                results.innerHTML = `

                    <div class="clip">

                        <h3>
                            ❌ Connection Error
                        </h3>

                        <p>
                            ${error.message}
                        </p>

                        <p>
                            Check that your Worker is
                            deployed and available.
                        </p>

                    </div>

                `;

            }


            button.disabled = false;

        };


    // ----------------------------------------
    // Video loading error
    // ----------------------------------------

    video.onerror =
        function() {

            status.innerText =
                "This video could not be read.";

            status.className =
                "error";

            button.disabled = false;

        };


    // ----------------------------------------
    // Give browser access to video metadata
    // ----------------------------------------

    video.src =
        URL.createObjectURL(file);

}


</script>


</body>

</html>
