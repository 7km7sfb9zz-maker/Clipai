<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ClipAI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #080808;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 60px 20px;
    text-align: center;
}

.logo {
    font-size: 52px;
    font-weight: 800;
}

.logo span {
    color: #7c5cff;
}

.subtitle {
    color: #999;
    font-size: 18px;
    margin-bottom: 40px;
}

.upload {
    background: #111;
    border: 2px dashed #333;
    border-radius: 20px;
    padding: 35px 20px;
}

input {
    width: 100%;
    margin-top: 20px;
}

button {
    margin-top: 25px;
    padding: 15px 30px;
    border: none;
    border-radius: 12px;
    background: #7c5cff;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

button:active {
    transform: scale(0.98);
}

#status {
    margin-top: 20px;
    color: #aaa;
}

.clip {
    margin-top: 20px;
    padding: 20px;
    background: #151515;
    border-radius: 15px;
    text-align: left;
}

.score {
    color: #7c5cff;
    font-weight: bold;
}

.duration {
    color: #888;
    margin-top: 10px;
}

</style>
</head>

<body>

<div class="container">

<h1 class="logo">
Clip<span>AI</span>
</h1>

<p class="subtitle">
Turn long videos into short-form content.
</p>

<div class="upload">

<h2>Upload a video</h2>

<p>
Choose a video and let ClipAI analyse it.
</p>

<input
    type="file"
    id="video"
    accept="video/*"
>

<br>

<button onclick="analyse()">
Find Viral Clips
</button>

<div id="status"></div>

<div id="results"></div>

</div>

</div>

<script>

function formatTime(seconds) {

    seconds = Math.floor(seconds);

    const minutes = Math.floor(seconds / 60);

    const remainingSeconds = seconds % 60;

    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(remainingSeconds).padStart(2, "0")
    );
}


function async function analyse() {

    const file =
        document.getElementById("video").files[0];

    const status =
        document.getElementById("status");

    const results =
        document.getElementById("results");

    if (!file) {

        status.innerText =
            "Please select a video first.";

        return;
    }

    results.innerHTML = "";

    status.innerText =
        "Reading video...";


    // Create video element
    const video =
        document.createElement("video");

    video.preload = "metadata";


    video.onloadedmetadata = async function() {

        const duration = video.duration;


        // Make sure duration is valid
        if (!Number.isFinite(duration) || duration <= 0) {

            status.innerText =
                "Could not determine video duration.";

            return;
        }


        status.innerText =
            "Connecting to ClipAI AI...";


        try {

            const response = await fetch(
                "https://clipai-api.7km7sfb9zz.workers.dev",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        // Temporary transcript.
                        // Real transcription comes next.
                        transcript:
                            "This is a temporary test transcript.",

                        duration: duration

                    })

                }
            );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error || "API error"
                );

            }


            status.innerText =
                "ClipAI backend connected!";


            /*
             * Display the information returned
             * by the Worker.
             */

            results.innerHTML = `

                <div class="clip">

                    <h3>✅ Backend Connected</h3>

                    <p>
                        <b>Video length:</b>
                        ${formatTime(data.duration)}
                    </p>

                    <p>
                        <b>Transcript received:</b>
                        ${data.transcriptLength}
                        characters
                    </p>

                    <p class="score">
                        API connection successful
                    </p>

                </div>

            `;


        } catch (error) {

            console.error(error);

            status.innerText =
                "Could not connect to ClipAI API.";

            results.innerHTML = `

                <div class="clip">

                    <h3>❌ Connection Error</h3>

                    <p>
                        ${error.message}
                    </p>

                </div>

            `;

        }

    };


    video.onerror = function() {

        status.innerText =
            "This video could not be read.";

    };


    video.src =
        URL.createObjectURL(file);

}

    const file =
        document.getElementById("video").files[0];

    const status =
        document.getElementById("status");

    const results =
        document.getElementById("results");

    if (!file) {

        status.innerText =
            "Please select a video first.";

        return;

    }

    results.innerHTML = "";

    status.innerText =
        "Reading video duration...";


    /*
    Create a temporary video element
    so the browser can read the actual
    duration of the uploaded video.
    */

    const video =
        document.createElement("video");

    video.preload = "metadata";


    video.onloadedmetadata = function() {

        const duration = video.duration;


        /*
        Safety check:
        Make absolutely sure the duration
        is a real positive number.
        */

        if (!Number.isFinite(duration) || duration <= 0) {

            status.innerText =
                "Could not determine video duration.";

            return;

        }


        /*
        DEMO CLIP

        Start at 0 seconds.

        The maximum possible end time
        is ALWAYS the video's duration.
        */

        const start = 0;

        let end = Math.min(
            30,
            duration
        );


        /*
        If the video is extremely short,
        make sure the end is still valid.
        */

        if (end > duration) {
            end = duration;
        }


        /*
        Final mathematical safety check.
        */

        const safeStart =
            Math.max(0, Math.min(start, duration));

        const safeEnd =
            Math.max(
                safeStart,
                Math.min(end, duration)
            );


        status.innerText =
            "Analysis complete.";


        results.innerHTML = `

        <div class="clip">

            <h3>🔥 Recommended Clip #1</h3>

            <p>
                <b>Video length:</b>
                ${formatTime(duration)}
            </p>

            <p>
                <b>Clip:</b>
                ${formatTime(safeStart)}
                –
                ${formatTime(safeEnd)}
            </p>

            <p>
                <b>Hook:</b>
                Your most interesting moment starts here.
            </p>

            <p>
                <b>Title:</b>
                The moment everything changed
            </p>

            <p class="score">
                Viral Score: 94/100
            </p>

            <p class="duration">
                ✓ Timestamp verified against video length
            </p>

        </div>

        `;


        /*
        Release the temporary video object.
        */

        URL.revokeObjectURL(video.src);

    };


    video.onerror = function() {

        status.innerText =
            "This video could not be read.";

    };


    /*
    Give the browser the uploaded video.
    */

    video.src =
        URL.createObjectURL(file);

}

</script>

</body>
</html>
