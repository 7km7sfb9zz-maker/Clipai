<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ClipAI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #080808;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 60px 20px;
    text-align: center;
}

.logo {
    font-size: 52px;
    font-weight: 800;
}

.logo span {
    color: #7c5cff;
}

.subtitle {
    color: #999;
    font-size: 18px;
    margin-bottom: 40px;
}

.upload {
    background: #111;
    border: 2px dashed #333;
    border-radius: 20px;
    padding: 35px 20px;
}

input {
    width: 100%;
    margin-top: 20px;
}

button {
    margin-top: 25px;
    padding: 15px 30px;
    border: none;
    border-radius: 12px;
    background: #7c5cff;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

#status {
    margin-top: 20px;
    color: #aaa;
}

.clip {
    margin-top: 20px;
    padding: 20px;
    background: #151515;
    border-radius: 15px;
    text-align: left;
}

.score {
    color: #7c5cff;
    font-weight: bold;
}

</style>
</head>

<body>

<div class="container">

<h1 class="logo">
Clip<span>AI</span>
</h1>

<p class="subtitle">
Turn long videos into short-form content.
</p>

<div class="upload">

<h2>Upload a video</h2>

<p>
Choose a video and let ClipAI analyse it.
</p>

<input
type="file"
id="video"
accept="video/*"
>

<button onclick="analyse()">
Find Viral Clips
</button>

<div id="status"></div>

<div id="results"></div>

</div>

</div>

<script>

function analyse() {

    const file =
    document.getElementById("video").files[0];

    const status =
    document.getElementById("status");

    const results =
    document.getElementById("results");

    if (!file) {

        status.innerText =
        "Please select a video first.";

        return;

    }

    status.innerText =
    "Uploading and analysing video...";

    results.innerHTML = "";

    /*
    TEMPORARY DEMO

    The real AI will replace this
    once we connect the backend.
    */

    setTimeout(() => {

        status.innerText =
        "Analysis complete.";

        results.innerHTML = `

        <div class="clip">

        <h3>🔥 Recommended Clip #1</h3>

        <p>
        <b>Time:</b> 02:14 – 02:47
        </p>

        <p>
        <b>Hook:</b>
        "You won't believe what happened next..."
        </p>

        <p>
        <b>Title:</b>
        The moment everything changed
        </p>

        <p class="score">
        Viral Score: 94/100
        </p>

        </div>

        `;

    }, 2000);

}

</script>

</body>
</html>
