<script type="module">

import {
    FFmpeg
} from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/+esm";

import {
    fetchFile,
    toBlobURL
} from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/+esm";


const API_URL =
    "https://clipai-api.7km7sfb9zz.workers.dev";

const CHUNK_MINUTES = 5;
const CHUNK_SECONDS = CHUNK_MINUTES * 60;

let fileInput;
let button;
let status;
let results;
let progressContainer;
let progressFill;
let progressText;

let ffmpeg = null;
let ffmpegLoaded = false;
let videoDuration = 0;


/* =========================================================
   START AFTER HTML HAS LOADED
========================================================= */

document.addEventListener("DOMContentLoaded", () => {

    fileInput =
        document.getElementById("video");

    button =
        document.getElementById("analyseButton");

    status =
        document.getElementById("status");

    results =
        document.getElementById("results");

    progressContainer =
        document.getElementById("progressContainer");

    progressFill =
        document.getElementById("progressFill");

    progressText =
        document.getElementById("progressText");


    /*
     * Prevent a missing HTML element from
     * causing the entire website to crash.
     */

    if (!fileInput) {
        console.error("ClipAI: #video not found.");
        return;
    }


    if (!button) {
        console.error("ClipAI: #analyseButton not found.");
        return;
    }


    if (!status) {
        console.error("ClipAI: #status not found.");
        return;
    }


    if (!results) {
        console.error("ClipAI: #results not found.");
        return;
    }


    fileInput.addEventListener(
        "change",
        inspectVideo
    );


    /*
     * Make BOTH possible button methods work.
     */

    window.analyse = analyse;


    button.addEventListener(
        "click",
        analyse
    );


    console.log(
        "ClipAI frontend loaded successfully."
    );

});


/* =========================================================
   VIDEO INSPECTION
========================================================= */

function inspectVideo() {

    const file =
        fileInput.files[0];

    const panel =
        document.getElementById("videoInfo");

    const warning =
        document.getElementById("warning");


    if (!file) {

        if (panel) {
            panel.style.display = "none";
        }

        return;
    }


    const video =
        document.createElement("video");


    video.preload =
        "metadata";


    const objectURL =
        URL.createObjectURL(file);


    video.onloadedmetadata =
        function () {

            videoDuration =
                video.duration;


            const chunks =
                Math.ceil(
                    videoDuration /
                    CHUNK_SECONDS
                );


            const durationInfo =
                document.getElementById(
                    "durationInfo"
                );

            const sizeInfo =
                document.getElementById(
                    "sizeInfo"
                );

            const chunksInfo =
                document.getElementById(
                    "chunksInfo"
                );

            const chunkSizeInfo =
                document.getElementById(
                    "chunkSizeInfo"
                );

            const timeInfo =
                document.getElementById(
                    "timeInfo"
                );


            if (durationInfo) {

                durationInfo.innerText =
                    formatDuration(
                        videoDuration
                    );

            }


            if (sizeInfo) {

                sizeInfo.innerText =
                    formatBytes(
                        file.size
                    );

            }


            if (chunksInfo) {

                chunksInfo.innerText =
                    chunks;

            }


            if (chunkSizeInfo) {

                chunkSizeInfo.innerText =
                    CHUNK_MINUTES +
                    " minutes";

            }


            if (timeInfo) {

                timeInfo.innerText =
                    estimateProcessingTime(
                        videoDuration,
                        file.size
                    );

            }


            if (panel) {

                panel.style.display =
                    "block";

            }


            if (
                warning &&
                videoDuration >= 3600
            ) {

                warning.style.display =
                    "block";

                warning.innerHTML =
                    "⚠️ <strong>Long video detected.</strong><br>" +
                    "ClipAI will process this in " +
                    chunks +
                    " audio chunks.";

            }

            else if (
                warning &&
                file.size >
                500 * 1024 * 1024
            ) {

                warning.style.display =
                    "block";

                warning.innerHTML =
                    "⚠️ <strong>Large file detected.</strong><br>" +
                    "ClipAI will process the audio in smaller pieces.";

            }

            else if (warning) {

                warning.style.display =
                    "none";

            }


            URL.revokeObjectURL(
                objectURL
            );

        };


    video.onerror =
        function () {

            if (panel) {
                panel.style.display = "none";
            }

            if (warning) {

                warning.style.display =
                    "block";

                warning.innerText =
                    "⚠️ Could not read this video.";

            }

            URL.revokeObjectURL(
                objectURL
            );

        };


    video.src =
        objectURL;

}


/* =========================================================
   PROCESSING ESTIMATE
========================================================= */

function estimateProcessingTime(
    duration,
    fileSize
) {

    const minutes =
        duration / 60;


    let estimated =
        minutes * 0.35;


    if (
        fileSize >
        1024 * 1024 * 1024
    ) {

        estimated += 2;

    }


    estimated =
        Math.max(
            1,
            estimated
        );


    const low =
        Math.max(
            1,
            Math.round(
                estimated * 0.7
            )
        );


    const high =
        Math.max(
            low + 1,
            Math.round(
                estimated * 1.6
            )
        );


    return (
        "~" +
        low +
        "–" +
        high +
        " min"
    );

}


/* =========================================================
   LOAD FFMPEG
========================================================= */

async function loadFFmpeg() {

    if (ffmpegLoaded) {
        return;
    }


    status.innerText =
        "⚙️ Loading video processor...";


    ffmpeg =
        new FFmpeg();


    const baseURL =
        "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd";


    await ffmpeg.load({

        coreURL:
            await toBlobURL(
                baseURL +
                "/ffmpeg-core.js",
                "text/javascript"
            ),

        wasmURL:
            await toBlobURL(
                baseURL +
                "/ffmpeg-core.wasm",
                "application/wasm"
            )

    });


    ffmpegLoaded =
        true;

}


/* =========================================================
   MAIN ANALYSIS
========================================================= */

async function analyse() {

    const file =
        fileInput.files[0];


    if (!file) {

        status.innerText =
            "Please select a video first.";

        status.className =
            "error";

        return;

    }


    if (
        !videoDuration ||
        !Number.isFinite(videoDuration)
    ) {

        status.innerText =
            "Please wait for the video information to load.";

        status.className =
            "error";

        return;

    }


    button.disabled =
        true;


    results.innerHTML =
        "";


    if (progressContainer) {

        progressContainer.style.display =
            "block";

    }


    if (progressFill) {

        progressFill.style.width =
            "0%";

    }


    if (progressText) {

        progressText.innerText =
            "Preparing your video...";

    }


    status.innerText =
        "Preparing your video...";

    status.className =
        "";


    try {

        /* =================================================
           LOAD FFMPEG
        ================================================= */

        await loadFFmpeg();


        status.innerText =
            "🎬 Preparing video...";


        progressText.innerText =
            "Reading video...";


        /*
         * Store video inside browser FFmpeg memory.
         */

        await ffmpeg.writeFile(
            "input.mp4",
            await fetchFile(file)
        );


        const totalChunks =
            Math.ceil(
                videoDuration /
                CHUNK_SECONDS
            );


        const transcripts = [];


        const processingStart =
            Date.now();


        /* =================================================
           TRANSCRIBE EVERY CHUNK
        ================================================= */

        for (
            let i = 0;
            i < totalChunks;
            i++
        ) {

            const chunkStart =
                i *
                CHUNK_SECONDS;


            const chunkDuration =
                Math.min(
                    CHUNK_SECONDS,
                    videoDuration -
                    chunkStart
                );


            const chunkName =
                "chunk_" +
                i +
                ".wav";


            const chunkNumber =
                i + 1;


            progressText.innerText =
                "🎙️ Extracting chunk " +
                chunkNumber +
                " / " +
                totalChunks +
                "...";


            await ffmpeg.exec([

                "-ss",
                String(chunkStart),

                "-i",
                "input.mp4",

                "-t",
                String(chunkDuration),

                "-vn",

                "-ac",
                "1",

                "-ar",
                "16000",

                "-c:a",
                "pcm_s16le",

                chunkName

            ]);


            const audioData =
                await ffmpeg.readFile(
                    chunkName
                );


            const audioBlob =
                new Blob(
                    [
                        audioData.buffer
                    ],
                    {
                        type:
                            "audio/wav"
                    }
                );


            /* =================================================
               SEND AUDIO TO WORKER
            ================================================= */

            progressText.innerText =
                "🧠 Transcribing chunk " +
                chunkNumber +
                " / " +
                totalChunks +
                "...";


            const formData =
                new FormData();


            formData.append(
                "audio",
                audioBlob,
                chunkName
            );


            formData.append(
                "chunkIndex",
                String(i)
            );


            formData.append(
                "chunkStart",
                String(chunkStart)
            );


            formData.append(
                "chunkDuration",
                String(chunkDuration)
            );


            const response =
                await fetch(
                    API_URL,
                    {
                        method: "POST",
                        body: formData
                    }
                );


            const responseText =
                await response.text();


            let data;


            try {

                data =
                    JSON.parse(
                        responseText
                    );

            }

            catch {

                throw new Error(
                    "Worker returned invalid JSON: " +
                    responseText
                );

            }


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Chunk " +
                    chunkNumber +
                    " failed."
                );

            }


            transcripts.push({

                index:
                    i,

                start:
                    chunkStart,

                end:
                    chunkStart +
                    chunkDuration,

                text:
                    data.transcript ||
                    "",

                segments:
                    data.segments ||
                    []

            });


            const completed =
                chunkNumber;


            const percent =
                Math.round(
                    (
                        completed /
                        totalChunks
                    ) *
                    100
                );


            progressFill.style.width =
                percent + "%";


            const elapsed =
                (
                    Date.now() -
                    processingStart
                ) / 1000;


            const average =
                elapsed /
                completed;


            const remaining =
                average *
                (
                    totalChunks -
                    completed
                );


            progressText.innerText =
                "✅ Chunk " +
                completed +
                " / " +
                totalChunks +
                " • " +
                percent +
                "% • ~" +
                formatDuration(
                    remaining
                ) +
                " remaining";


            try {

                await ffmpeg.deleteFile(
                    chunkName
                );

            }

            catch {}

        }


        /* =================================================
           BUILD COMPLETE TIMESTAMPED TRANSCRIPT
        ================================================= */

        progressText.innerText =
            "🧠 Combining transcripts...";


        const combinedTranscript =
            transcripts
                .sort(
                    (a, b) =>
                        a.index -
                        b.index
                )
                .map(
                    chunk => {

                        /*
                         * Use actual Whisper segments
                         * where available so the second
                         * AI gets useful timestamps.
                         */

                        if (
                            chunk.segments &&
                            chunk.segments.length
                        ) {

                            return chunk.segments
                                .map(segment => {

                                    const relativeStart =
                                        Number(
                                            segment.start
                                        ) || 0;

                                    const absoluteStart =
                                        chunk.start +
                                        relativeStart;

                                    return (
                                        "[" +
                                        formatTime(
                                            absoluteStart
                                        ) +
                                        "] " +
                                        (
                                            segment.text ||
                                            ""
                                        )
                                    );

                                })
                                .join("\n");

                        }


                        return (
                            "[" +
                            formatTime(
                                chunk.start
                            ) +
                            "] " +
                            chunk.text
                        );

                    }
                )
                .join("\n")
                .trim();


        /* =================================================
           SECOND AI STAGE
           DEEP VIRAL ANALYSIS
        ================================================= */

        progressFill.style.width =
            "90%";


        progressText.innerText =
            "🔥 Finding viral moments...";


        const analysisResponse =
            await fetch(
                API_URL,
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            action:
                                "analyze",

                            transcript:
                                combinedTranscript,

                            duration:
                                videoDuration

                        })

                }
            );


        const analysisText =
            await analysisResponse.text();


        let analysisData = {};


        try {

            analysisData =
                JSON.parse(
                    analysisText
                );

        }

        catch {

            throw new Error(
                "Deep analysis returned invalid JSON: " +
                analysisText
            );

        }


        if (
            !analysisResponse.ok ||
            analysisData.success === false
        ) {

            throw new Error(
                analysisData.error ||
                "Deep AI analysis failed."
            );

        }


        progressFill.style.width =
            "100%";


        progressText.innerText =
            "✅ Analysis complete";


        status.innerText =
            "✅ AI analysis complete!";


        status.className =
            "success";


        /* =================================================
           VIRAL CLIPS
        ================================================= */

        let viralHTML =
            "";


        if (
            Array.isArray(
                analysisData.viralClips
            ) &&
            analysisData.viralClips.length
        ) {

            viralHTML = `

                <div class="clip">

                    <h2>
                        🔥 Viral Clips Found
                    </h2>

                    ${

                        analysisData
                            .viralClips
                            .map(
                                (
                                    clip,
                                    index
                                ) => `

                                <div class="clip viral">

                                    <h3>
                                        🔥 Viral Clip #${
                                            index + 1
                                        }
                                    </h3>

                                    <div class="score">
                                        ${
                                            escapeHTML(
                                                clip.score
                                            )
                                        }/100
                                    </div>

                                    <div class="score-label">
                                        Viral potential
                                    </div>

                                    <div class="clip-time">
                                        ⏱️
                                        ${
                                            formatTime(
                                                clip.start
                                            )
                                        }
                                        →
                                        ${
                                            formatTime(
                                                clip.end
                                            )
                                        }
                                    </div>

                                    ${
                                        clip.hook
                                        ?
                                        `
                                        <p>
                                            🪝
                                            <strong>
                                                ${
                                                    escapeHTML(
                                                        clip.hook
                                                    )
                                                }
                                            </strong>
                                        </p>
                                        `
                                        :
                                        ""
                                    }

                                    <p class="reason">
                                        ${
                                            escapeHTML(
                                                clip.reason ||
                                                "Strong potential moment."
                                            )
                                        }
                                    </p>

                                    ${
                                        Array.isArray(
                                            clip.strengths
                                        ) &&
                                        clip.strengths.length
                                        ?
                                        `
                                        <p>
                                            <strong>
                                                Why it works:
                                            </strong>
                                            ${
                                                escapeHTML(
                                                    clip.strengths.join(
                                                        " • "
                                                    )
                                                )
                                            }
                                        </p>
                                        `
                                        :
                                        ""
                                    }

                                    ${
                                        Array.isArray(
                                            clip.weaknesses
                                        ) &&
                                        clip.weaknesses.length
                                        ?
                                        `
                                        <p>
                                            <strong>
                                                Weakness:
                                            </strong>
                                            ${
                                                escapeHTML(
                                                    clip.weaknesses.join(
                                                        " • "
                                                    )
                                                )
                                            }
                                        </p>
                                        `
                                        :
                                        ""
                                    }

                                </div>

                            `
                            )
                            .join("")
                    }

                </div>

            `;

        }

        else {

            viralHTML = `

                <div class="clip">

                    <h2>
                        🔥 Viral Clips
                    </h2>

                    <p>
                        No strong viral moments were found.
                    </p>

                </div>

            `;

        }


        /* =================================================
           FINAL HOOK
        ================================================= */

        const hookHTML =
            analysisData.hook
            ?

            `

            <div class="clip">

                <div class="hook-label">
                    🧠 AI-GENERATED HOOK
                </div>

                <div class="hook">
                    ${
                        escapeHTML(
                            analysisData.hook
                        )
                    }
                </div>

            </div>

            `

            :

            "";


        /* =================================================
           TRANSCRIPT
        ================================================= */

        results.innerHTML = `

            ${viralHTML}

            ${hookHTML}

            <div class="clip">

                <h3>
                    🎙️ AI Transcript
                </h3>

                <p class="transcript">
                    ${
                        escapeHTML(
                            combinedTranscript ||
                            "No speech was detected."
                        )
                    }
                </p>

            </div>

        `;


        /* =================================================
           CLEAN FFMPEG MEMORY
        ================================================= */

        try {

            await ffmpeg.deleteFile(
                "input.mp4"
            );

        }

        catch {}


    }

    catch (error) {

        console.error(
            "ClipAI error:",
            error
        );


        if (progressFill) {

            progressFill.style.width =
                "0%";

        }


        if (progressText) {

            progressText.innerText =
                "❌ Processing failed";

        }


        status.innerText =
            "❌ ClipAI encountered an error.";


        status.className =
            "error";


        results.innerHTML = `

            <div class="clip">

                <h3>
                    ❌ Error
                </h3>

                <p>
                    ${
                        escapeHTML(
                            error.message ||
                            "Unknown error."
                        )
                    }
                </p>

            </div>

        `;

    }


    button.disabled =
        false;

}


/* =========================================================
   FORMAT DURATION
========================================================= */

function formatDuration(
    seconds
) {

    seconds =
        Math.max(
            0,
            Math.floor(
                Number(seconds) || 0
            )
        );


    const hours =
        Math.floor(
            seconds / 3600
        );


    const minutes =
        Math.floor(
            (
                seconds % 3600
            ) / 60
        );


    const remaining =
        seconds % 60;


    if (hours > 0) {

        return (
            hours +
            "h " +
            minutes +
            "m"
        );

    }


    return (
        minutes +
        "m " +
        remaining +
        "s"
    );

}


/* =========================================================
   FORMAT FILE SIZE
========================================================= */

function formatBytes(
    bytes
) {

    if (!bytes) {
        return "0 Bytes";
    }


    const units = [
        "Bytes",
        "KB",
        "MB",
        "GB",
        "TB"
    ];


    const i =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    return (
        (
            bytes /
            Math.pow(
                1024,
                i
            )
        )
        .toFixed(2)
        +
        " " +
        units[i]
    );

}


/* =========================================================
   FORMAT VIDEO TIME
========================================================= */

function formatTime(
    seconds
) {

    seconds =
        Number(seconds) || 0;


    const hours =
        Math.floor(
            seconds / 3600
        );


    const minutes =
        Math.floor(
            (
                seconds % 3600
            ) / 60
        );


    const remaining =
        Math.floor(
            seconds % 60
        );


    if (hours > 0) {

        return (
            String(hours)
                .padStart(2, "0") +
            ":" +
            String(minutes)
                .padStart(2, "0") +
            ":" +
            String(remaining)
                .padStart(2, "0")
        );

    }


    return (
        String(minutes)
            .padStart(2, "0") +
        ":" +
        String(remaining)
            .padStart(2, "0")
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    text
) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

</script>
