<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ClipAI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #080808;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont,
                 "Segoe UI", Arial, sans-serif;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 60px 20px;
    text-align: center;
}

.logo {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -2px;
}

.logo span {
    color: #7c5cff;
}

.subtitle {
    color: #999;
    font-size: 18px;
    margin-bottom: 40px;
}

.upload {
    background: #111;
    border: 2px dashed #333;
    border-radius: 20px;
    padding: 35px 20px;
}

input[type="file"] {
    width: 100%;
    margin-top: 20px;
}

button {
    margin-top: 25px;
    padding: 15px 30px;
    border: none;
    border-radius: 12px;
    background: #7c5cff;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
}

#status {
    margin-top: 20px;
    color: #aaa;
    min-height: 24px;
}

.clip {
    margin-top: 20px;
    padding: 20px;
    background: #151515;
    border-radius: 15px;
    text-align: left;
}

.hook {
    font-size: 21px;
    font-weight: 700;
    line-height: 1.5;
}

.hook-label {
    color: #7c5cff;
    font-weight: bold;
    margin-bottom: 8px;
}

.segment {
    padding: 10px 0;
    border-bottom: 1px solid #292929;
}

.segment-time {
    color: #7c5cff;
    font-size: 13px;
    font-weight: bold;
}

.segment-text {
    margin-top: 4px;
    line-height: 1.5;
}

.success {
    color: #66ff99;
}

.error {
    color: #ff6666;
}

.transcript {
    white-space: pre-wrap;
    line-height: 1.6;
}

</style>

</head>


<body>


<div class="container">


<h1 class="logo">
Clip<span>AI</span>
</h1>


<p class="subtitle">
Turn long videos into short-form content.
</p>


<div class="upload">


<h2>
Upload a video
</h2>


<p>
ClipAI will transcribe your video using AI.
</p>


<input
    type="file"
    id="video"
    accept="video/*"
>


<br>


<button
    id="analyseButton"
    onclick="analyse()"
>

Find Viral Clips

</button>


<div id="status"></div>


<div id="results"></div>


</div>


</div>


<script>


const API_URL =
"https://clipai-api.7km7sfb9zz.workers.dev";


async function analyse() {


    const file =
        document.getElementById("video").files[0];


    const status =
        document.getElementById("status");


    const results =
        document.getElementById("results");


    const button =
        document.getElementById("analyseButton");


    if (!file) {

        status.innerText =
            "Please select a video first.";

        status.className =
            "error";

        return;

    }


    button.disabled = true;

    results.innerHTML = "";

    status.innerText =
        "Preparing your video...";

    status.className = "";


    try {


        const formData =
            new FormData();


        formData.append(
            "audio",
            file
        );


        status.innerText =
            "Uploading video to ClipAI...";


        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",
                    body: formData
                }
            );


        const responseText =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(responseText);

        }

        catch {

            throw new Error(
                "Worker returned an invalid response: "
                + responseText
            );

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Worker returned an error."
            );

        }


        status.innerText =
            "✅ AI analysis complete!";

        status.className =
            "success";


        let segmentsHTML = "";


        /*
         * Display timestamped transcript
         */

        if (
            data.segments &&
            data.segments.length > 0
        ) {

            segmentsHTML =
                data.segments.map(
                    segment => {

                        const start =
                            formatTime(
                                segment.start
                            );

                        const end =
                            formatTime(
                                segment.end
                            );

                        return `

                            <div class="segment">

                                <div class="segment-time">
                                    ${start} → ${end}
                                </div>

                                <div class="segment-text">
                                    ${escapeHTML(
                                        segment.text || ""
                                    )}
                                </div>

                            </div>

                        `;

                    }
                ).join("");

        }


        results.innerHTML = `

            ${
                data.hook
                ?
                `
                <div class="clip">

                    <div class="hook-label">
                        🧠 AI-GENERATED HOOK
                    </div>

                    <div class="hook">
                        ${escapeHTML(
                            data.hook
                        )}
                    </div>

                </div>
                `
                :
                ""
            }


            <div class="clip">

                <h3>
                    🎙️ AI Transcript
                </h3>

                ${
                    segmentsHTML
                    ||
                    `
                    <p class="transcript">
                        ${escapeHTML(
                            data.transcript ||
                            "No speech was detected."
                        )}
                    </p>
                    `
                }

            </div>

        `;


    }

    catch (error) {


        console.error(
            "ClipAI error:",
            error
        );


        status.innerText =
            "Could not connect to ClipAI.";

        status.className =
            "error";


        results.innerHTML = `

            <div class="clip">

                <h3>
                    ❌ Connection Error
                </h3>

                <p>
                    ${escapeHTML(
                        error.message
                    )}
                </p>

                <p>
                    Check the Worker deployment
                    and Workers AI binding.
                </p>

            </div>

        `;

    }


    button.disabled = false;

}


function formatTime(seconds) {

    seconds =
        Number(seconds) || 0;


    const minutes =
        Math.floor(
            seconds / 60
        );


    const remaining =
        Math.floor(
            seconds % 60
        );


    return (
        String(minutes).padStart(2, "0")
        +
        ":"
        +
        String(remaining).padStart(2, "0")
    );

}


function escapeHTML(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


</script>


</body>

</html>
