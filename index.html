<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipAI — AI Video Analyzer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: #080808;
    color: #fff;
}

.container {
    width: min(1000px, 92%);
    margin: 0 auto;
    padding: 50px 0;
}

header {
    text-align: center;
    margin-bottom: 40px;
}

.logo {
    font-size: 48px;
    font-weight: 900;
    letter-spacing: -2px;
}

.logo span {
    color: #ff1744;
}

.subtitle {
    color: #aaa;
    margin-top: 10px;
    font-size: 17px;
}

.card {
    background: #111;
    border: 1px solid #292929;
    border-radius: 18px;
    padding: 28px;
    margin-bottom: 20px;
}

.upload {
    border: 2px dashed #444;
    border-radius: 16px;
    padding: 45px 20px;
    text-align: center;
    cursor: pointer;
    transition: .2s;
}

.upload:hover {
    border-color: #ff1744;
    background: #161616;
}

.upload input {
    display: none;
}

.upload-icon {
    font-size: 45px;
    margin-bottom: 15px;
}

.upload-title {
    font-size: 21px;
    font-weight: 700;
}

.upload-subtitle {
    color: #888;
    margin-top: 8px;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 17px;
    border: 0;
    border-radius: 12px;
    background: #ff1744;
    color: white;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
}

button:hover {
    background: #e60035;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

#videoInfo {
    display: none;
    margin-top: 20px;
}

.info-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.info {
    background: #181818;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
}

.info-value {
    font-size: 19px;
    font-weight: 800;
}

.info-label {
    color: #777;
    font-size: 12px;
    margin-top: 5px;
}

.warning {
    display: none;
    margin-top: 15px;
    padding: 14px;
    background: #251d00;
    border: 1px solid #665000;
    border-radius: 10px;
    color: #ffd740;
}

#status {
    margin-top: 18px;
    text-align: center;
    color: #aaa;
    min-height: 22px;
}

.success {
    color: #00e676 !important;
}

.error {
    color: #ff5252 !important;
}

#progressContainer {
    display: none;
    margin-top: 25px;
}

.progress {
    width: 100%;
    height: 12px;
    background: #222;
    border-radius: 20px;
    overflow: hidden;
}

#progressFill {
    width: 0%;
    height: 100%;
    background: #ff1744;
    transition: width .25s;
}

#progressText {
    margin-top: 10px;
    text-align: center;
    color: #aaa;
    font-size: 14px;
}

.clip {
    background: #111;
    border: 1px solid #292929;
    border-radius: 16px;
    padding: 24px;
    margin-top: 20px;
}

.clip h2,
.clip h3 {
    margin-top: 0;
}

.viral {
    border-color: #ff1744;
}

.score {
    font-size: 35px;
    font-weight: 900;
    color: #ff1744;
}

.score-label {
    color: #888;
    margin-bottom: 15px;
}

.clip-time {
    display: inline-block;
    background: #1d1d1d;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    font-weight: 700;
}

.reason {
    color: #ccc;
    line-height: 1.6;
}

.hook-label {
    color: #ff1744;
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 10px;
}

.hook {
    font-size: 23px;
    font-weight: 800;
    line-height: 1.4;
}

.transcript {
    color: #ccc;
    white-space: pre-wrap;
    line-height: 1.7;
    max-height: 600px;
    overflow-y: auto;
}

footer {
    text-align: center;
    color: #555;
    margin-top: 40px;
}

@media (max-width: 700px) {
    .container {
        padding: 25px 0;
    }

    .logo {
        font-size: 38px;
    }

    .info-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .card {
        padding: 18px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">Clip<span>AI</span></div>
    <div class="subtitle">
        Upload a video and let AI find your strongest viral moments.
    </div>
</header>

<div class="card">

    <label class="upload" for="video">
        <div class="upload-icon">🎬</div>

        <div class="upload-title">
            Choose a video
        </div>

        <div class="upload-subtitle">
            MP4, MOV, WebM and other browser-supported formats
        </div>

        <input
            id="video"
            type="file"
            accept="video/*"
        >
    </label>

    <div id="videoInfo">

        <div class="info-grid">

            <div class="info">
                <div
                    class="info-value"
                    id="durationInfo"
                >
                    —
                </div>

                <div class="info-label">
                    Duration
                </div>
            </div>

            <div class="info">
                <div
                    class="info-value"
                    id="sizeInfo"
                >
                    —
                </div>

                <div class="info-label">
                    File size
                </div>
            </div>

            <div class="info">
                <div
                    class="info-value"
                    id="chunksInfo"
                >
                    —
                </div>

                <div class="info-label">
                    Audio chunks
                </div>
            </div>

            <div class="info">
                <div
                    class="info-value"
                    id="chunkSizeInfo"
                >
                    —
                </div>

                <div class="info-label">
                    Chunk size
                </div>
            </div>

        </div>

        <div
            id="timeInfo"
            style="text-align:center;color:#888;margin-top:15px;"
        >
        </div>

        <div
            id="warning"
            class="warning"
        >
        </div>

    </div>

    <button
        id="analyseButton"
        type="button"
    >
        🔥 Analyse Video
    </button>

    <div id="status"></div>

    <div id="progressContainer">

        <div class="progress">
            <div id="progressFill"></div>
        </div>

        <div id="progressText">
            Preparing...
        </div>

    </div>

</div>

<div id="results"></div>

<footer>
    ClipAI AI Video Analysis
</footer>

</div>


<script type="module">

import {
    FFmpeg
} from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/+esm";

import {
    fetchFile,
    toBlobURL
} from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/+esm";


const API_URL =
    "https://clipai-api.7km7sfb9zz.workers.dev";

const CHUNK_MINUTES = 5;
const CHUNK_SECONDS = CHUNK_MINUTES * 60;


let fileInput = null;
let button = null;
let status = null;
let results = null;
let progressContainer = null;
let progressFill = null;
let progressText = null;

let ffmpeg = null;
let ffmpegLoaded = false;
let videoDuration = 0;


/* =========================================================
   INITIALISE
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    initialise
);


function initialise() {

    fileInput =
        document.getElementById("video");

    button =
        document.getElementById("analyseButton");

    status =
        document.getElementById("status");

    results =
        document.getElementById("results");

    progressContainer =
        document.getElementById("progressContainer");

    progressFill =
        document.getElementById("progressFill");

    progressText =
        document.getElementById("progressText");


    if (
        !fileInput ||
        !button ||
        !status ||
        !results
    ) {

        document.body.innerHTML = `
            <div style="
                color:white;
                background:#080808;
                min-height:100vh;
                display:flex;
                align-items:center;
                justify-content:center;
                font-family:Arial;
                text-align:center;
                padding:30px;
            ">
                <div>
                    <h1>ClipAI failed to initialise.</h1>
                    <p>Please refresh the page.</p>
                </div>
            </div>
        `;

        return;
    }


    fileInput.addEventListener(
        "change",
        inspectVideo
    );


    button.addEventListener(
        "click",
        analyse
    );


    window.analyse =
        analyse;

}


/* =========================================================
   VIDEO INSPECTION
========================================================= */

function inspectVideo() {

    const file =
        fileInput.files[0];


    const panel =
        document.getElementById("videoInfo");

    const warning =
        document.getElementById("warning");


    if (!file) {

        if (panel) {
            panel.style.display = "none";
        }

        return;
    }


    const video =
        document.createElement("video");


    video.preload =
        "metadata";


    const objectURL =
        URL.createObjectURL(file);


    video.onloadedmetadata =
        function() {

            videoDuration =
                Number(video.duration);


            if (
                !Number.isFinite(
                    videoDuration
                ) ||
                videoDuration <= 0
            ) {

                status.innerText =
                    "Could not determine video duration.";

                status.className =
                    "error";

                URL.revokeObjectURL(
                    objectURL
                );

                return;
            }


            const chunks =
                Math.ceil(
                    videoDuration /
                    CHUNK_SECONDS
                );


            const durationInfo =
                document.getElementById(
                    "durationInfo"
                );

            const sizeInfo =
                document.getElementById(
                    "sizeInfo"
                );

            const chunksInfo =
                document.getElementById(
                    "chunksInfo"
                );

            const chunkSizeInfo =
                document.getElementById(
                    "chunkSizeInfo"
                );

            const timeInfo =
                document.getElementById(
                    "timeInfo"
                );


            if (durationInfo) {

                durationInfo.innerText =
                    formatDuration(
                        videoDuration
                    );

            }


            if (sizeInfo) {

                sizeInfo.innerText =
                    formatBytes(
                        file.size
                    );

            }


            if (chunksInfo) {

                chunksInfo.innerText =
                    chunks;

            }


            if (chunkSizeInfo) {

                chunkSizeInfo.innerText =
                    CHUNK_MINUTES +
                    " minutes";

            }


            if (timeInfo) {

                timeInfo.innerText =
                    "Estimated processing: " +
                    estimateProcessingTime(
                        videoDuration,
                        file.size
                    );

            }


            if (panel) {

                panel.style.display =
                    "block";

            }


            if (
                warning &&
                videoDuration >= 3600
            ) {

                warning.style.display =
                    "block";

                warning.innerHTML =
                    "⚠️ <strong>Long video detected.</strong><br>" +
                    "ClipAI will process it in " +
                    chunks +
                    " audio chunks.";

            }

            else if (
                warning &&
                file.size >
                500 * 1024 * 1024
            ) {

                warning.style.display =
                    "block";

                warning.innerHTML =
                    "⚠️ <strong>Large file detected.</strong><br>" +
                    "The audio will be processed in smaller pieces.";

            }

            else if (warning) {

                warning.style.display =
                    "none";

            }


            status.innerText =
                "Video ready.";

            status.className =
                "";


            URL.revokeObjectURL(
                objectURL
            );

        };


    video.onerror =
        function() {

            if (panel) {
                panel.style.display = "none";
            }

            if (warning) {

                warning.style.display =
                    "block";

                warning.innerText =
                    "⚠️ Could not read this video.";

            }

            URL.revokeObjectURL(
                objectURL
            );

        };


    video.src =
        objectURL;

}


/* =========================================================
   PROCESSING ESTIMATE
========================================================= */

function estimateProcessingTime(
    duration,
    fileSize
) {

    const minutes =
        duration / 60;


    let estimated =
        minutes * 0.35;


    if (
        fileSize >
        1024 * 1024 * 1024
    ) {

        estimated += 2;

    }


    estimated =
        Math.max(
            1,
            estimated
        );


    const low =
        Math.max(
            1,
            Math.round(
                estimated * 0.7
            )
        );


    const high =
        Math.max(
            low + 1,
            Math.round(
                estimated * 1.6
            )
        );


    return (
        "~" +
        low +
        "–" +
        high +
        " min"
    );

}


/* =========================================================
   LOAD FFMPEG
========================================================= */

async function loadFFmpeg() {

    if (ffmpegLoaded) {
        return;
    }


    status.innerText =
        "⚙️ Loading video processor...";


    ffmpeg =
        new FFmpeg();


    const baseURL =
        "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd";


    await ffmpeg.load({

        coreURL:
            await toBlobURL(
                baseURL +
                "/ffmpeg-core.js",
                "text/javascript"
            ),

        wasmURL:
            await toBlobURL(
                baseURL +
                "/ffmpeg-core.wasm",
                "application/wasm"
            )

    });


    ffmpegLoaded =
        true;

}


/* =========================================================
   MAIN ANALYSIS
========================================================= */

async function analyse() {

    const file =
        fileInput.files[0];


    if (!file) {

        status.innerText =
            "Please select a video first.";

        status.className =
            "error";

        return;
    }


    if (
        !videoDuration ||
        !Number.isFinite(
            videoDuration
        )
    ) {

        status.innerText =
            "Please wait for the video information to load.";

        status.className =
            "error";

        return;
    }


    button.disabled =
        true;


    results.innerHTML =
        "";


    progressContainer.style.display =
        "block";

    progressFill.style.width =
        "0%";

    progressText.innerText =
        "Preparing your video...";

    status.innerText =
        "Preparing your video...";

    status.className =
        "";


    try {

        await loadFFmpeg();


        status.innerText =
            "🎬 Preparing video...";


        await ffmpeg.writeFile(
            "input.mp4",
            await fetchFile(file)
        );


        const totalChunks =
            Math.ceil(
                videoDuration /
                CHUNK_SECONDS
            );


        const transcripts = [];


        const processingStart =
            Date.now();


        /* =================================================
           TRANSCRIBE CHUNKS
        ================================================= */

        for (
            let i = 0;
            i < totalChunks;
            i++
        ) {

            const chunkStart =
                i *
                CHUNK_SECONDS;


            const chunkDuration =
                Math.min(
                    CHUNK_SECONDS,
                    videoDuration -
                    chunkStart
                );


            const chunkName =
                "chunk_" +
                i +
                ".wav";


            const chunkNumber =
                i + 1;


            progressText.innerText =
                "🎙️ Extracting chunk " +
                chunkNumber +
                " / " +
                totalChunks +
                "...";


            await ffmpeg.exec([

                "-ss",
                String(chunkStart),

                "-i",
                "input.mp4",

                "-t",
                String(chunkDuration),

                "-vn",

                "-ac",
                "1",

                "-ar",
                "16000",

                "-c:a",
                "pcm_s16le",

                chunkName

            ]);


            const audioData =
                await ffmpeg.readFile(
                    chunkName
                );


            const audioBlob =
                new Blob(
                    [
                        audioData.buffer
                    ],
                    {
                        type:
                            "audio/wav"
                    }
                );


            progressText.innerText =
                "🧠 Transcribing chunk " +
                chunkNumber +
                " / " +
                totalChunks +
                "...";


            const formData =
                new FormData();


            formData.append(
                "audio",
                audioBlob,
                chunkName
            );


            formData.append(
                "chunkIndex",
                String(i)
            );


            formData.append(
                "chunkStart",
                String(chunkStart)
            );


            formData.append(
                "chunkDuration",
                String(chunkDuration)
            );


            const response =
                await fetch(
                    API_URL,
                    {
                        method:
                            "POST",

                        body:
                            formData
                    }
                );


            const responseText =
                await response.text();


            let data;


            try {

                data =
                    JSON.parse(
                        responseText
                    );

            }

            catch {

                throw new Error(
                    "Worker returned invalid JSON:\n" +
                    responseText
                );

            }


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Chunk " +
                    chunkNumber +
                    " failed."
                );

            }


            transcripts.push({

                index:
                    i,

                start:
                    chunkStart,

                end:
                    chunkStart +
                    chunkDuration,

                text:
                    data.transcript ||
                    "",

                segments:
                    Array.isArray(
                        data.segments
                    )
                    ?
                    data.segments
                    :
                    []

            });


            const percent =
                Math.round(
                    (
                        chunkNumber /
                        totalChunks
                    ) *
                    80
                );


            progressFill.style.width =
                percent + "%";


            const elapsed =
                (
                    Date.now() -
                    processingStart
                ) / 1000;


            const average =
                elapsed /
                chunkNumber;


            const remaining =
                average *
                (
                    totalChunks -
                    chunkNumber
                );


            progressText.innerText =
                "✅ Chunk " +
                chunkNumber +
                " / " +
                totalChunks +
                " • ~" +
                formatDuration(
                    remaining
                ) +
                " remaining";


            try {

                await ffmpeg.deleteFile(
                    chunkName
                );

            }

            catch {}

        }


        /* =================================================
           BUILD TIMESTAMPED TRANSCRIPT
        ================================================= */

        progressText.innerText =
            "🧠 Combining transcripts...";


        const combinedTranscript =
            transcripts
                .sort(
                    (a, b) =>
                        a.index -
                        b.index
                )
                .map(
                    chunk => {

                        if (
                            chunk.segments &&
                            chunk.segments.length
                        ) {

                            return chunk.segments
                                .map(
                                    segment => {

                                        const relativeStart =
                                            Number(
                                                segment.start
                                            ) || 0;

                                        const relativeEnd =
                                            Number(
                                                segment.end
                                            ) ||
                                            relativeStart;

                                        const absoluteStart =
                                            chunk.start +
                                            relativeStart;

                                        const absoluteEnd =
                                            chunk.start +
                                            relativeEnd;

                                        return (
                                            "[" +
                                            formatTime(
                                                absoluteStart
                                            ) +
                                            " - " +
                                            formatTime(
                                                absoluteEnd
                                            ) +
                                            "] " +
                                            (
                                                segment.text ||
                                                ""
                                            )
                                        );

                                    }
                                )
                                .join("\n");

                        }


                        return (
                            "[" +
                            formatTime(
                                chunk.start
                            ) +
                            "] " +
                            chunk.text
                        );

                    }
                )
                .join("\n")
                .trim();


        /* =================================================
           SECOND AI — DEEP VIRAL ANALYSIS
        ================================================= */

        progressFill.style.width =
            "90%";

        progressText.innerText =
            "🔥 Performing deep viral analysis...";


        const analysisResponse =
            await fetch(
                API_URL,
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            action:
                                "analyze",

                            transcript:
                                combinedTranscript,

                            duration:
                                videoDuration

                        })

                }
            );


        const analysisText =
            await analysisResponse.text();


        let analysisData;


        try {

            analysisData =
                JSON.parse(
                    analysisText
                );

        }

        catch {

            throw new Error(
                "Deep analysis returned invalid JSON:\n" +
                analysisText
            );

        }


        if (!analysisResponse.ok) {

            throw new Error(
                analysisData.error ||
                "Deep viral analysis failed."
            );

        }


        progressFill.style.width =
            "100%";

        progressText.innerText =
            "✅ Analysis complete";

        status.innerText =
            "✅ AI analysis complete!";

        status.className =
            "success";


        /* =================================================
           VIRAL CLIPS
        ================================================= */

        let viralHTML =
            "";


        if (
            Array.isArray(
                analysisData.viralClips
            ) &&
            analysisData.viralClips.length
        ) {

            viralHTML = `

                <div class="clip">

                    <h2>
                        🔥 Viral Clips Found
                    </h2>

                    ${
                        analysisData
                            .viralClips
                            .map(
                                (
                                    clip,
                                    index
                                ) => `

                                    <div class="clip viral">

                                        <h3>
                                            🔥 Viral Clip #${
                                                index + 1
                                            }
                                        </h3>

                                        <div class="score">
                                            ${
                                                escapeHTML(
                                                    clip.score
                                                )
                                            }/100
                                        </div>

                                        <div class="score-label">
                                            Viral potential
                                        </div>

                                        <div class="clip-time">
                                            ⏱️
                                            ${
                                                formatTime(
                                                    clip.start
                                                )
                                            }
                                            →
                                            ${
                                                formatTime(
                                                    clip.end
                                                )
                                            }
                                        </div>

                                        ${
                                            clip.hook
                                            ?
                                            `
                                            <p>
                                                🪝
                                                <strong>
                                                    ${
                                                        escapeHTML(
                                                            clip.hook
                                                        )
                                                    }
                                                </strong>
                                            </p>
                                            `
                                            :
                                            ""
                                        }

                                        <p class="reason">
                                            ${
                                                escapeHTML(
                                                    clip.reason ||
                                                    "Strong potential moment."
                                                )
                                            }
                                        </p>

                                        ${
                                            Array.isArray(
                                                clip.strengths
                                            ) &&
                                            clip.strengths.length
                                            ?
                                            `
                                            <p class="reason">
                                                <strong>
                                                    Why it works:
                                                </strong>
                                                ${
                                                    escapeHTML(
                                                        clip.strengths.join(
                                                            " • "
                                                        )
                                                    )
                                                }
                                            </p>
                                            `
                                            :
                                            ""
                                        }

                                        ${
                                            Array.isArray(
                                                clip.weaknesses
                                            ) &&
                                            clip.weaknesses.length
                                            ?
                                            `
                                            <p class="reason">
                                                <strong>
                                                    Weakness:
                                                </strong>
                                                ${
                                                    escapeHTML(
                                                        clip.weaknesses.join(
                                                            " • "
                                                        )
                                                    )
                                                }
                                            </p>
                                            `
                                            :
                                            ""
                                        }

                                    </div>

                                `
                            )
                            .join("")
                    }

                </div>

            `;

        }

        else {

            viralHTML = `

                <div class="clip">

                    <h2>
                        🔥 Viral Clips
                    </h2>

                    <p>
                        No strong viral moments were found.
                    </p>

                </div>

            `;

        }


        /* =================================================
           HOOK
        ================================================= */

        const hookHTML =
            analysisData.hook
            ?

            `

            <div class="clip">

                <div class="hook-label">
                    🧠 AI-GENERATED HOOK
                </div>

                <div class="hook">
                    ${
                        escapeHTML(
                            analysisData.hook
                        )
                    }
                </div>

            </div>

            `

            :

            "";


        /* =================================================
           TRANSCRIPT
        ================================================= */

        results.innerHTML = `

            ${viralHTML}

            ${hookHTML}

            <div class="clip">

                <h3>
                    🎙️ AI Transcript
                </h3>

                <p class="transcript">
                    ${
                        escapeHTML(
                            combinedTranscript ||
                            "No speech was detected."
                        )
                    }
                </p>

            </div>

        `;


        try {

            await ffmpeg.deleteFile(
                "input.mp4"
            );

        }

        catch {}

    }

    catch (error) {

        console.error(
            "ClipAI error:",
            error
        );


        progressFill.style.width =
            "0%";

        progressText.innerText =
            "❌ Processing failed";

        status.innerText =
            "❌ ClipAI encountered an error.";

        status.className =
            "error";


        results.innerHTML = `

            <div class="clip">

                <h3>
                    ❌ Error
                </h3>

                <p class="reason">
                    ${
                        escapeHTML(
                            error.message ||
                            "Unknown error."
                        )
                    }
                </p>

            </div>

        `;

    }

    finally {

        button.disabled =
            false;

    }

}


/* =========================================================
   FORMATTING
========================================================= */

function formatDuration(seconds) {

    seconds =
        Math.max(
            0,
            Math.floor(
                Number(seconds) || 0
            )
        );


    const hours =
        Math.floor(
            seconds / 3600
        );


    const minutes =
        Math.floor(
            (
                seconds % 3600
            ) / 60
        );


    const remaining =
        seconds % 60;


    if (hours > 0) {

        return (
            hours +
            "h " +
            minutes +
            "m"
        );

    }


    return (
        minutes +
        "m " +
        remaining +
        "s"
    );

}


function formatBytes(bytes) {

    if (!bytes) {
        return "0 Bytes";
    }


    const units = [
        "Bytes",
        "KB",
        "MB",
        "GB",
        "TB"
    ];


    const i =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    return (
        (
            bytes /
            Math.pow(
                1024,
                i
            )
        )
        .toFixed(2) +
        " " +
        units[i]
    );

}


function formatTime(seconds) {

    seconds =
        Number(seconds) || 0;


    const hours =
        Math.floor(
            seconds / 3600
        );


    const minutes =
        Math.floor(
            (
                seconds % 3600
            ) / 60
        );


    const remaining =
        Math.floor(
            seconds % 60
        );


    if (hours > 0) {

        return (
            String(hours)
                .padStart(2, "0") +
            ":" +
            String(minutes)
                .padStart(2, "0") +
            ":" +
            String(remaining)
                .padStart(2, "0")
        );

    }


    return (
        String(minutes)
            .padStart(2, "0") +
        ":" +
        String(remaining)
            .padStart(2, "0")
    );

}


function escapeHTML(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}
