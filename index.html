<script type="module">

import {
    FFmpeg
} from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/+esm";

import {
    fetchFile,
    toBlobURL
} from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/+esm";


const API_URL =
    "https://clipai-api.7km7sfb9zz.workers.dev";

const CHUNK_MINUTES = 5;

const CHUNK_SECONDS =
    CHUNK_MINUTES * 60;


const fileInput =
    document.getElementById("video");

const button =
    document.getElementById("analyseButton");

const status =
    document.getElementById("status");

const results =
    document.getElementById("results");

const progressContainer =
    document.getElementById("progressContainer");

const progressFill =
    document.getElementById("progressFill");

const progressText =
    document.getElementById("progressText");


let ffmpeg = null;
let ffmpegLoaded = false;

let videoDuration = 0;


/* =========================================
   VIDEO INSPECTION
========================================= */

fileInput.addEventListener(
    "change",
    inspectVideo
);


function inspectVideo() {

    const file =
        fileInput.files[0];

    const panel =
        document.getElementById("videoInfo");

    const warning =
        document.getElementById("warning");


    if (!file) {

        panel.style.display =
            "none";

        return;

    }


    const video =
        document.createElement("video");


    video.preload =
        "metadata";


    video.onloadedmetadata =
        function () {

            videoDuration =
                video.duration;


            const chunks =
                Math.ceil(
                    videoDuration /
                    CHUNK_SECONDS
                );


            document.getElementById(
                "durationInfo"
            ).innerText =
                formatDuration(
                    videoDuration
                );


            document.getElementById(
                "sizeInfo"
            ).innerText =
                formatBytes(
                    file.size
                );


            document.getElementById(
                "chunksInfo"
            ).innerText =
                chunks;


            document.getElementById(
                "chunkSizeInfo"
            ).innerText =
                CHUNK_MINUTES +
                " minutes";


            document.getElementById(
                "timeInfo"
            ).innerText =
                estimateProcessingTime(
                    videoDuration,
                    file.size
                );


            panel.style.display =
                "block";


            if (videoDuration >= 3600) {

                warning.style.display =
                    "block";

                warning.innerHTML =
                    "⚠️ <strong>Long video detected.</strong><br>" +
                    "ClipAI will process this in " +
                    chunks +
                    " smaller audio chunks.";

            }

            else if (
                file.size >
                500 * 1024 * 1024
            ) {

                warning.style.display =
                    "block";

                warning.innerHTML =
                    "⚠️ <strong>Large file detected.</strong><br>" +
                    "ClipAI will process the audio in smaller pieces.";

            }

            else {

                warning.style.display =
                    "none";

            }


            URL.revokeObjectURL(
                video.src
            );

        };


    video.onerror =
        function () {

            panel.style.display =
                "none";

            warning.style.display =
                "block";

            warning.innerText =
                "⚠️ Could not read this video.";

        };


    video.src =
        URL.createObjectURL(
            file
        );

}


/* =========================================
   PROCESSING ESTIMATE
========================================= */

function estimateProcessingTime(
    duration,
    fileSize
) {

    const minutes =
        duration / 60;


    let estimated =
        minutes * 0.35;


    if (
        fileSize >
        1024 * 1024 * 1024
    ) {

        estimated += 2;

    }


    estimated =
        Math.max(
            1,
            estimated
        );


    const low =
        Math.max(
            1,
            Math.round(
                estimated * 0.7
            )
        );


    const high =
        Math.max(
            low + 1,
            Math.round(
                estimated * 1.6
            )
        );


    return (
        "~" +
        low +
        "–" +
        high +
        " min"
    );

}


/* =========================================
   LOAD FFMPEG
========================================= */

async function loadFFmpeg() {

    if (ffmpegLoaded) {

        return;

    }


    status.innerText =
        "⚙️ Loading video processor...";


    ffmpeg =
        new FFmpeg();


    const baseURL =
        "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd";


    await ffmpeg.load({

        coreURL:
            await toBlobURL(
                baseURL +
                "/ffmpeg-core.js",
                "text/javascript"
            ),

        wasmURL:
            await toBlobURL(
                baseURL +
                "/ffmpeg-core.wasm",
                "application/wasm"
            )

    });


    ffmpegLoaded =
        true;

}


/* =========================================
   MAIN ANALYSIS
========================================= */

window.analyse =
    analyse;


async function analyse() {

    const file =
        fileInput.files[0];


    if (!file) {

        status.innerText =
            "Please select a video first.";

        status.className =
            "error";

        return;

    }


    button.disabled =
        true;


    results.innerHTML =
        "";


    progressContainer.style.display =
        "block";


    progressFill.style.width =
        "0%";


    progressText.innerText =
        "Preparing your video...";


    status.innerText =
        "Preparing your video...";

    status.className =
        "";


    try {

        /* =================================
           LOAD FFMPEG
        ================================= */

        await loadFFmpeg();


        status.innerText =
            "🎬 Preparing video...";


        progressText.innerText =
            "Reading video...";


        /*
         * Put the uploaded video into
         * browser memory only.
         */

        await ffmpeg.writeFile(
            "input.mp4",
            await fetchFile(file)
        );


        const totalChunks =
            Math.ceil(
                videoDuration /
                CHUNK_SECONDS
            );


        const transcripts = [];

        const chunkTimes = [];


        const processingStart =
            Date.now();


        /* =================================
           PROCESS EACH CHUNK
        ================================= */

        for (
            let i = 0;
            i < totalChunks;
            i++
        ) {

            const chunkStart =
                i *
                CHUNK_SECONDS;


            const chunkDuration =
                Math.min(
                    CHUNK_SECONDS,
                    videoDuration -
                    chunkStart
                );


            const chunkName =
                "chunk_" +
                i +
                ".wav";


            /*
             * Current chunk number.
             */

            const chunkNumber =
                i + 1;


            progressText.innerText =
                "🎙️ Extracting chunk " +
                chunkNumber +
                " / " +
                totalChunks +
                "...";


            /*
             * Extract audio only.
             *
             * 16 kHz
             * mono
             * PCM WAV
             *
             * This is ideal for Whisper.
             */

            await ffmpeg.exec([

                "-ss",
                String(chunkStart),

                "-i",
                "input.mp4",

                "-t",
                String(chunkDuration),

                "-vn",

                "-ac",
                "1",

                "-ar",
                "16000",

                "-c:a",
                "pcm_s16le",

                chunkName

            ]);


            const audioData =
                await ffmpeg.readFile(
                    chunkName
                );


            const audioBlob =
                new Blob(
                    [
                        audioData.buffer
                    ],
                    {
                        type:
                            "audio/wav"
                    }
                );


            /* =================================
               SEND CHUNK TO WORKER
            ================================= */

            progressText.innerText =
                "🧠 Transcribing chunk " +
                chunkNumber +
                " / " +
                totalChunks +
                "...";


            const formData =
                new FormData();


            formData.append(
                "audio",
                audioBlob,
                chunkName
            );


            /*
             * Tell the Worker where this
             * chunk belongs in the original
             * video.
             */

            formData.append(
                "chunkIndex",
                String(i)
            );


            formData.append(
                "chunkStart",
                String(chunkStart)
            );


            formData.append(
                "chunkDuration",
                String(chunkDuration)
            );


            const response =
                await fetch(
                    API_URL,
                    {
                        method: "POST",
                        body: formData
                    }
                );


            const responseText =
                await response.text();


            let data;


            try {

                data =
                    JSON.parse(
                        responseText
                    );

            }

            catch {

                throw new Error(
                    "Worker returned an invalid response: " +
                    responseText
                );

            }


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Chunk " +
                    chunkNumber +
                    " failed."
                );

            }


            /*
             * Save transcript with its
             * original timestamp.
             */

            transcripts.push({

                index:
                    i,

                start:
                    chunkStart,

                end:
                    chunkStart +
                    chunkDuration,

                text:
                    data.transcript ||
                    ""

            });


            chunkTimes.push({
                start:
                    chunkStart,

                end:
                    chunkStart +
                    chunkDuration
            });


            /* =================================
               PROGRESS
            ================================= */

            const completed =
                chunkNumber;


            const percent =
                Math.round(
                    (
                        completed /
                        totalChunks
                    ) *
                    100
                );


            progressFill.style.width =
                percent + "%";


            const elapsed =
                (
                    Date.now() -
                    processingStart
                ) / 1000;


            const average =
                elapsed /
                completed;


            const remaining =
                average *
                (
                    totalChunks -
                    completed
                );


            progressText.innerText =
                "✅ Chunk " +
                completed +
                " / " +
                totalChunks +
                " • " +
                percent +
                "% • ~" +
                formatDuration(
                    remaining
                ) +
                " remaining";


            /*
             * Delete temporary WAV.
             */

            try {

                await ffmpeg.deleteFile(
                    chunkName
                );

            }

            catch {}

        }


        /* =================================
           COMBINE TRANSCRIPT
        ================================= */

        progressText.innerText =
            "🧠 Combining transcripts...";


        const combinedTranscript =
            transcripts
                .sort(
                    (a, b) =>
                        a.index -
                        b.index
                )
                .map(
                    chunk =>
                        `[${formatTime(chunk.start)}] ` +
                        chunk.text
                )
                .join("\n\n")
                .trim();


        /* =================================
           VIRAL ANALYSIS
        ================================= */

        progressFill.style.width =
            "95%";


        progressText.innerText =
            "🔥 Finding viral-worthy moments...";


        /*
         * We send the combined transcript
         * to the Worker for the second AI
         * stage.
         *
         * This keeps your existing
         * viralClips + hook response format.
         */

        const analysisResponse =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            action:
                                "analyze",

                            transcript:
                                combinedTranscript,

                            duration:
                                videoDuration

                        })

                    }
                );


        /*
         * If your current Worker doesn't
         * support the JSON analysis route,
         * don't fail the whole transcription.
         */

        let analysisData = {};


        const analysisText =
            await analysisResponse.text();


        try {

            analysisData =
                JSON.parse(
                    analysisText
                );

        }

        catch {

            analysisData = {};

        }


        /*
         * If the second AI stage isn't
         * available yet, we still show
         * the complete transcript.
         */

        progressFill.style.width =
            "100%";


        progressText.innerText =
            "✅ Analysis complete";


        status.innerText =
            "✅ AI analysis complete!";


        status.className =
            "success";


        /* =================================
           VIRAL CLIPS
        ================================= */

        let viralHTML =
            "";


        if (
            analysisData.viralClips &&
            Array.isArray(
                analysisData.viralClips
            ) &&
            analysisData.viralClips.length
        ) {

            viralHTML = `

                <div class="clip">

                    <h2>
                        🔥 Viral Clips Found
                    </h2>

                    ${
                        analysisData
                            .viralClips
                            .map(
                                (
                                    clip,
                                    index
                                ) => `

                                <div
                                    class="clip viral"
                                >

                                    <h3>
                                        🔥 Viral Clip #${
                                            index + 1
                                        }
                                    </h3>

                                    <div class="score">
                                        ${
                                            escapeHTML(
                                                clip.score
                                            )
                                        }/100
                                    </div>

                                    <div class="score-label">
                                        Viral potential
                                    </div>

                                    <div class="clip-time">

                                        ⏱️

                                        ${
                                            formatTime(
                                                clip.start
                                            )
                                        }

                                        →

                                        ${
                                            formatTime(
                                                clip.end
                                            )
                                        }

                                    </div>

                                    ${
                                        clip.hook
                                        ?
                                        `
                                        <p>
                                            🪝
                                            <strong>
                                                ${
                                                    escapeHTML(
                                                        clip.hook
                                                    )
                                                }
                                            </strong>
                                        </p>
                                        `
                                        :
                                        ""
                                    }

                                    <p class="reason">
                                        ${
                                            escapeHTML(
                                                clip.reason ||
                                                "Strong potential moment."
                                            )
                                        }
                                    </p>

                                </div>

                            `
                            )
                            .join("")
                    }

                </div>

            `;

        }


        /* =================================
           HOOK
        ================================= */

        const hookHTML =
            analysisData.hook
            ?

            `

            <div class="clip">

                <div class="hook-label">
                    🧠 AI-GENERATED HOOK
                </div>

                <div class="hook">
                    ${
                        escapeHTML(
                            analysisData.hook
                        )
                    }
                </div>

            </div>

            `

            :

            "";


        /* =================================
           TRANSCRIPT
        ================================= */

        results.innerHTML = `

            ${viralHTML}

            ${hookHTML}

            <div class="clip">

                <h3>
                    🎙️ AI Transcript
                </h3>

                <p class="transcript">
                    ${
                        escapeHTML(
                            combinedTranscript ||
                            "No speech was detected."
                        )
                    }
                </p>

            </div>

        `;


        /*
         * Delete original video from
         * FFmpeg memory.
         */

        try {

            await ffmpeg.deleteFile(
                "input.mp4"
            );

        }

        catch {}


    }

    catch (error) {

        console.error(
            "ClipAI error:",
            error
        );


        progressFill.style.width =
            "0%";


        progressText.innerText =
            "❌ Processing failed";


        status.innerText =
            "Could not connect to ClipAI.";


        status.className =
            "error";


        results.innerHTML = `

            <div class="clip">

                <h3>
                    ❌ Connection Error
                </h3>

                <p>
                    ${
                        escapeHTML(
                            error.message
                        )
                    }
                </p>

            </div>

        `;

    }


    button.disabled =
        false;

}


/* =========================================
   FORMAT DURATION
========================================= */

function formatDuration(
    seconds
) {

    seconds =
        Math.max(
            0,
            Math.floor(
                Number(seconds) || 0
            )
        );


    const hours =
        Math.floor(
            seconds / 3600
        );


    const minutes =
        Math.floor(
            (
                seconds % 3600
            ) / 60
        );


    const remaining =
        seconds % 60;


    if (hours > 0) {

        return (
            hours +
            "h " +
            minutes +
            "m"
        );

    }


    return (
        minutes +
        "m " +
        remaining +
        "s"
    );

}


/* =========================================
   FORMAT FILE SIZE
========================================= */

function formatBytes(
    bytes
) {

    if (!bytes) {

        return "0 Bytes";

    }


    const units = [
        "Bytes",
        "KB",
        "MB",
        "GB",
        "TB"
    ];


    const i =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    return (
        (
            bytes /
            Math.pow(
                1024,
                i
            )
        )
        .toFixed(2)
        +
        " " +
        units[i]
    );

}


/* =========================================
   FORMAT VIDEO TIME
========================================= */

function formatTime(
    seconds
) {

    seconds =
        Number(seconds) || 0;


    const hours =
        Math.floor(
            seconds / 3600
        );


    const minutes =
        Math.floor(
            (
                seconds % 3600
            ) / 60
        );


    const remaining =
        Math.floor(
            seconds % 60
        );


    if (hours > 0) {

        return (
            String(hours)
                .padStart(2, "0") +
            ":" +
            String(minutes)
                .padStart(2, "0") +
            ":" +
            String(remaining)
                .padStart(2, "0")
        );

    }


    return (
        String(minutes)
            .padStart(2, "0") +
        ":" +
        String(remaining)
            .padStart(2, "0")
    );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(
    text
) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

</script>
